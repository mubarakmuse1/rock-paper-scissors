<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#667eea" />
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game-container">
      <header class="game-header">
        <h1>✊ Rock Paper Scissors</h1>
        <p class="subtitle">Choose your move and beat the computer!</p>
      </header>

      <!-- Scoreboard -->
      <section class="score-board" aria-label="Game score">
        <div class="score">
          <h3>👤 Player</h3>
          <p id="player-score">0</p>
        </div>

        <div class="score-divider">VS</div>

        <div class="score">
          <h3>🤖 Computer</h3>
          <p id="computer-score">0</p>
        </div>
      </section>

      <p class="target-score">First to <strong>5 points</strong> wins!</p>

      <!-- Game Status -->
      <section class="game-status">
        <h2 id="turn" aria-live="polite">Ready to play?</h2>

        <p id="game-message">Press Start Game to begin.</p>
      </section>

      <!-- Player Choices -->
      <section class="choices" aria-label="Choose your move">
        <button class="choice" data-choice="Rock" disabled>
          <span class="choice-icon">✊</span>
          <span>Rock</span>
        </button>

        <button class="choice" data-choice="Paper" disabled>
          <span class="choice-icon">✋</span>
          <span>Paper</span>
        </button>

        <button class="choice" data-choice="Scissors" disabled>
          <span class="choice-icon">✌️</span>
          <span>Scissors</span>
        </button>
      </section>

      <!-- Round Results -->
      <section class="result-box" aria-live="polite">
        <div class="player-choice">
          <span>Your choice</span>
          <p id="player-choice">-</p>
        </div>

        <div class="computer-choice">
          <span>Computer's choice</span>
          <p id="computer-choice">-</p>
        </div>

        <h2 id="result">Let's play!</h2>
      </section>

      <!-- Game Controls -->
      <section class="game-controls">
        <button id="start-btn" class="start-btn">▶ Start Game</button>

        <button id="restart-btn" class="restart-btn" disabled>
          ↻ Restart Game
        </button>
      </section>

      <footer>
        <p>Made in Somalia</p>
      </footer>
    </main>
  </body>
</html>
